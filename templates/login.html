<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Нэвтрэх - Адууны Бүртгэл</title>
    
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#198754">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register("{{ url_for('static', filename='sw.js') }}")
          .then(() => console.log('Service Worker Registered'));
      }
    </script>
    <style>
        body { background-color: #f4f6f9; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-card { max-width: 400px; width: 100%; border-radius: 20px; border: none; }
    </style>
</head>
<body>
    <div class="container px-3">
        <div class="card login-card shadow-lg p-4 mx-auto">
            <div class="text-center mb-4">
                <h2 class="fw-bold text-success">🐴 Нэвтрэх</h2>
                <p class="text-muted">Адууны бүртгэлийн систем</p>
            </div>

            {% if error %}
                <div class="alert alert-danger text-center py-2 small" role="alert">{{ error }}</div>
            {% endif %}
            {% if success %}
                <div class="alert alert-success text-center py-2 small" role="alert">{{ success }}</div>
            {% endif %}

            <form action="/login" method="POST">
                <div class="mb-3">
                    <label class="form-label small fw-bold text-muted">Хэрэглэгчийн нэр эсвэл И-мэйл</label>
                    <input type="text" name="username" class="form-control" placeholder="Нэр эсвэл и-мэйл" required>
                </div>
                <div class="mb-4">
                    <div class="d-flex justify-content-between">
                        <label class="form-label small fw-bold text-muted">Нууц үг</label>
                        <a href="/reset-password" class="text-decoration-none small text-success">Нууц үг мартсан?</a>
                    </div>
                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-success w-100 fw-bold py-2 mb-3" style="border-radius: 10px;">Нэвтрэх</button>
            </form>

            <div class="text-center mt-2">
                <p class="text-muted small">Шинэ хэрэглэгч үү? <a href="/register" class="text-success fw-bold text-decoration-none">Бүртгүүлэх</a></p>
            </div>
        </div>
    </div>
</body>
</html>
