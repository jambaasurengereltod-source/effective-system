<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Нэвтрэх</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #f8f9fa; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .auth-card { width: 100%; max-width: 400px; padding: 25px; border-radius: 15px; border: none; }
    </style>
</head>
<body>
    <div class="card auth-card shadow">
        <div class="card-body">
            <h3 class="card-title fw-bold text-center text-success mb-4">🐴 Малчин Нэвтрэх</h3>
            
            {% if error %}
                <div class="alert alert-danger p-2 small text-center">{{ error }}</div>
            {% endif %}
            {% if success %}
                <div class="alert alert-success p-2 small text-center">{{ success }}</div>
            {% endif %}

            <form action="/login" method="POST">
                <div class="mb-3">
                    <label class="form-label small fw-bold">Хэрэглэгчийн нэр эсвэл И-мэйл:</label>
                    <input type="text" name="username" class="form-control" placeholder="Нэр эсвэл и-мэйлээ оруулна уу" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-bold">Нууц үг:</label>
                    <input type="password" name="password" class="form-control" placeholder="Нууц үг" required>
                </div>
                <button type="submit" class="btn btn-success w-100 fw-bold mb-2">Нэвтрэх</button>
            </form>
            <div class="text-center">
                <a href="/reset-password" class="text-decoration-none small text-danger d-block mb-2">Нууц үгээ мартсан уу?</a>
                <a href="/register" class="text-decoration-none small text-muted">Шинэ малчин уу? Бүртгүүлэх</a>
            </div>
        </div>
    </div>
</body>
</html>
