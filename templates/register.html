<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бүртгүүлэх - Адууны Бүртгэл</title>
    
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#198754">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register("{{ url_for('static', filename='sw.js') }}")
          .then(() => console.log('Service Worker Registered'));
      }
    </script>
    <style>
        body { background-color: #f4f6f9; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .register-card { max-width: 400px; width: 100%; border-radius: 20px; border: none; }
    </style>
</head>
<body>
    <div class="container px-3">
        <div class="card register-card shadow-lg p-4 mx-auto">
            <div class="text-center mb-4">
                <h2 class="fw-bold text-success">🐴 Бүртгүүлэх</h2>
                <p class="text-muted">Шинэ данс үүсгэх</p>
            </div>

            {% if error %}
                <div class="alert alert-danger text-center py-2 small" role="alert">{{ error }}</div>
            {% endif %}

            <form action="/register" method="POST">
                <div class="mb-3">
                    <label class="form-label small fw-bold text-muted">Хэрэглэгчийн нэр</label>
                    <input type="text" name="username" class="form-control" placeholder="Нэвтрэх нэр зохиох" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-bold text-muted">И-мэйл хаяг</label>
                    <input type="email" name="email" class="form-control" placeholder="Жишээ: aduu@gmail.com" required>
                </div>
                <div class="mb-4">
                    <label class="form-label small fw-bold text-muted">Нууц үг</label>
                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-success w-100 fw-bold py-2 mb-3" style="border-radius: 10px;">Бүртгүүлэх</button>
            </form>

            <div class="text-center mt-2">
                <p class="text-muted small">Аль хэдийн данстай юу? <a href="/login" class="text-success fw-bold text-decoration-none">Нэвтрэх</a></p>
            </div>
        </div>
    </div>
</body>
</html>
