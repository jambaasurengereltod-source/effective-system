<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бүртгүүлэх</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #f8f9fa; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .auth-card { width: 100%; max-width: 400px; padding: 25px; border-radius: 15px; border: none; }
    </style>
</head>
<body>
    <div class="card auth-card shadow">
        <div class="card-body">
            <h3 class="card-title fw-bold text-center text-success mb-4">📝 Малчин Бүртгүүлэх</h3>
            
            {% if error %}
                <div class="alert alert-danger p-2 small text-center">{{ error }}</div>
            {% endif %}

            <form action="/register" method="POST">
                <div class="mb-3">
                    <label class="form-label small fw-bold">Хэрэглэгчийн нэр:</label>
                    <input type="text" name="username" class="form-control" placeholder="Нэвтрэх нэрээ зохионо уу" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-bold">И-мэйл хаяг:</label>
                    <input type="email" name="email" class="form-control" placeholder="Жишээ: malchin@gmail.com" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-bold">Нууц үг:</label>
                    <input type="password" name="password" class="form-control" placeholder="Нууц үг" required>
                </div>
                <button type="submit" class="btn btn-success w-100 fw-bold mb-3">Бүртгүүлэх</button>
            </form>
            <div class="text-center">
                <a href="/login" class="text-decoration-none small text-muted">Хаяг байгаа юу? Нэвтрэх</a>
            </div>
        </div>
    </div>
</body>
</html>
