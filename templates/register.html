<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Адуу Бүртгэл - Бүртгүүлэх</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #8d6e63 0%, #5d4037 100%); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .register-box { 
            background: rgba(255, 255, 255, 0.95); 
            padding: 40px 30px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); 
            width: 340px; 
            text-align: center;
            border-top: 5px solid #2e7d32; 
        }
        .logo { font-size: 50px; margin-bottom: 10px; }
        h2 { margin: 0 0 5px 0; color: #5d4037; font-size: 24px; font-weight: bold; }
        p.subtitle { color: #666; margin-top: 0; margin-bottom: 25px; font-size: 14px; }
        input { 
            width: 100%; 
            padding: 12px 15px; 
            margin: 8px 0; 
            border: 1px solid #ccc; 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 15px; 
            transition: 0.3s;
            background-color: #f8f9fa;
        }
        input:focus { border-color: #5d4037; background-color: #fff; outline: none; box-shadow: 0 0 5px rgba(93, 64, 55, 0.3); }
        button { 
            width: 100%; padding: 12px; 
            background: linear-gradient(135deg, #2e7d32 0%, #1b5e20 100%); 
            color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: 0.2s;
        }
        button:hover { background: linear-gradient(135deg, #1b5e20 0%, #0d230d 100%); transform: translateY(-1px); }
        .error { background-color: #ffebee; color: #c62828; padding: 10px; border-radius: 6px; margin-bottom: 15px; font-size: 14px; border: 1px solid #ffcdd2; text-align: center; }
        .success { background-color: #e8f5e9; color: #2e7d32; padding: 10px; border-radius: 6px; margin-bottom: 15px; font-size: 14px; border: 1px solid #c8e6c9; text-align: center; }
        .links { text-align: center; margin-top: 25px; font-size: 14px; color: #555; }
        .links a { color: #5d4037; text-decoration: none; font-weight: bold; }
        .links a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="register-box">
    <div class="logo">📝</div>
    <h2>БҮРТГЭЛ ҮҮСГЭХ</h2>
    <p class="subtitle">Шинэ малчны бүртгэл</p>
    
    {% if error %}
        <div class="error">❌ {{ error }}</div>
    {% endif %}
    {% if success %}
        <div class="success">✅ {{ success }}</div>
    {% endif %}
    
    <form method="POST" action="/register">
        <input type="text" name="username" placeholder="Шинэ нэвтрэх нэр" required>
        <input type="password" name="password" placeholder="Нууц үг" required>
        <input type="password" name="confirm_password" placeholder="Нууц үг давтах" required>
        <button type="submit">ШИНЭ БҮРТГЭЛ ХАДГАЛАХ</button>
    </form>
    
    <div class="links">
        Аль хэдийн бүртгэлтэй юу? <a href="/login">Нэвтрэх</a>
    </div>
</div>

</body>
</html>
