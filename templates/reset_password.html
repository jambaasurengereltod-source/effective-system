<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Нууц үг сэргээх</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #f8f9fa; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .reset-card { width: 100%; max-width: 400px; padding: 25px; border-radius: 15px; border: none; }
    </style>
</head>
<body>
    <div class="card reset-card shadow">
        <div class="card-body">
            <h4 class="card-title fw-bold text-center text-danger mb-4">🔐 Нууц үг сэргээх</h4>
            
            {% if error %}
                <div class="alert alert-danger p-2 small text-center">{{ error }}</div>
            {% endif %}

            <form action="/reset-password" method="POST">
                <div class="mb-3">
                    <label class="form-label small fw-bold">Бүртгэлтэй и-мэйл хаяг:</label>
                    <input type="email" name="email" class="form-control" placeholder="Бүртгүүлсэн и-мэйлээ оруулна уу" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-bold">Шинэ нууц үг:</label>
                    <input type="password" name="new_password" class="form-control" placeholder="Шинэ нууц үг оруулах" required>
                </div>
                <button type="submit" class="btn btn-danger w-100 fw-bold mb-3">Нууц үг шинэчлэх</button>
            </form>
            <div class="text-center">
                <a href="/login" class="text-decoration-none small text-muted">Буцах (Нэвтрэх)</a>
            </div>
        </div>
    </div>
</body>
</html>
